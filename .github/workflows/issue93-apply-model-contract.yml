name: Apply Scout model contract on isolated review branch
on:
  push:
    branches: ['fix/issue93-sim-clock-wheel-contract-20260914']
    paths: ['.github/workflows/issue93-apply-model-contract.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'XGC-Team/xgc2-gazebo-sim-agilex' && github.ref == 'refs/heads/fix/issue93-sim-clock-wheel-contract-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Apply only the reviewed baseline replacements
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          def read(path, expected):
              p=Path(path); b=p.read_bytes()
              sha=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              assert sha == expected, (path,sha,expected)
              return p,b.decode()
          def replace(s, old, new):
              assert s.count(old)==1, old
              return s.replace(old,new)
          p,s=read('scout/src/scout_skid_steer.cpp','2a23e32f214ecff28cb5bac26253b70003b117d4')
          s=replace(s,'#include "scout_gazebo/scout_skid_steer.hpp"','#include "scout_gazebo/scout_skid_steer.hpp"\n#include "scout_gazebo/wheel_allocation.hpp"')
          s=replace(s,'  private_nh.param("wheel_radius", wheel_radius_, 0.08);','  private_nh.param("wheel_radius", wheel_radius_, 0.08);\n  private_nh.param("wheel_velocity_limit", wheel_velocity_limit_, 24.0);')
          old='''  if (!std::isfinite(command_delay_s_) || command_delay_s_ < 0.0) {
              ROS_WARN("Invalid Scout command_delay_s %.6f; using 0", command_delay_s_);
              command_delay_s_ = 0.0;
            }'''
          # Match original two-space indentation without depending on YAML layout.
          start=s.index('  if (!std::isfinite(command_delay_s_)')
          end=s.index('\n  }',start)+4
          s=s[:start]+'''  if (!std::isfinite(command_delay_s_) || command_delay_s_ < 0.0) {
              throw std::invalid_argument("Scout command_delay_s must be finite and nonnegative");
            }'''.replace('\n              ','\n    ').replace('\n            }','\n  }')+s[end:]
          old='''  if (!std::isfinite(wheel_radius_) || wheel_radius_ <= 0.0 ||
                !std::isfinite(wheel_separation_) || wheel_separation_ <= 0.0 ||
                !std::isfinite(command_gain_) || !std::isfinite(angular_command_gain_)) {
              throw std::invalid_argument("Scout wheel geometry and command gains must be finite; geometry must be positive");
            }'''
          start=s.index('  if (!std::isfinite(wheel_radius_)')
          end=s.index('\n  }',start)+4
          new='''  ValidateAllocation({wheel_radius_, wheel_separation_, command_gain_,
                                angular_command_gain_, wheel_velocity_limit_});
            if (enable_command_limits_ &&
                (!std::isfinite(max_linear_speed_) || max_linear_speed_ <= 0.0 ||
                 !std::isfinite(max_angular_speed_) || max_angular_speed_ <= 0.0)) {
              throw std::invalid_argument("enabled Scout command limits must be finite and positive");
            }'''
          new=new.replace('\n            ', '\n  ').replace('\n              ', '\n    ').replace('\n                ', '\n      ')
          s=s[:start]+new+s[end:]
          s=replace(s,'  // Wall scheduling survives a paused/rewound clock. The plant itself uses\n  // ROS simulation time, so wall ticks never advance paused dynamics.\n  control_timer_ = nh_->createWallTimer(\n      ros::WallDuration(0.01), &ScoutSkidSteer::ControlTick, this);','  // Sample the pure-delay queue in the same ROS time base as its deadlines.\n  // A wall timer changes the simulated sampling interval with real-time factor.\n  // This 10 ms sampling/hold is distinct from the configured 5 ms transport delay.\n  // The independent emergency-hold thunk still clears/publishes zero while paused.\n  control_timer_ = nh_->createTimer(\n      ros::Duration(0.01), &ScoutSkidSteer::ControlTick, this);')
          s=replace(s,'void ScoutSkidSteer::ControlTick(const ros::WallTimerEvent &) {','void ScoutSkidSteer::ControlTick(const ros::TimerEvent &) {')
          start=s.index('    const double steering = command.angular')
          end=s.index('    motor_fr_pub_.publish',start)
          new='''    WheelTargets targets;
              try {
                targets = AllocateWheelTargets(
                    command.linear, command.angular,
                    {wheel_radius_, wheel_separation_, command_gain_,
                     angular_command_gain_, wheel_velocity_limit_});
              } catch (const std::exception &error) {
                ROS_ERROR_THROTTLE(1.0, "Invalid Scout wheel allocation: %s", error.what());
                PublishZeroMotors();
                return;
              }
              std_msgs::Float64 motor_cmd[4];
              for (std::size_t index = 0; index < 4; ++index) {
                motor_cmd[index].data = targets.radians_per_second[index];
              }
          '''
          new=new.replace('\n              ', '\n    ').replace('\n                ', '\n      ').replace('\n                    ', '\n          ').rstrip()+'\n'
          s=s[:start]+new+s[end:]
          p.write_text(s)
          p,s=read('scout/include/scout_gazebo/scout_skid_steer.hpp','7d162ec55a698af573b0d72b3f65848d98167859')
          s=replace(s,'  double wheel_radius_;','  double wheel_radius_;\n  double wheel_velocity_limit_;')
          s=replace(s,'  ros::WallTimer control_timer_;','  ros::Timer control_timer_;')
          s=replace(s,'void ControlTick(const ros::WallTimerEvent &event);','void ControlTick(const ros::TimerEvent &event);')
          p.write_text(s)
          p,s=read('scout/launch/spawn_accurate.launch','6e3c8e9cf65c512f42c7739c71bb65e2fcd4710b')
          needle='        <param name="wheel_separation" type="double" value="$(arg wheel_separation)" />'
          s=replace(s,needle,needle+'\n        <param name="wheel_velocity_limit" type="double" value="$(arg wheel_velocity_limit)" />')
          p.write_text(s)
          p,s=read('scout/CMakeLists.txt','16830331bdaf49cc81e7556b3de63d8e92c4859a')
          needle='  find_package(PythonInterp REQUIRED)'
          s=replace(s,needle,needle+'\n  add_test(NAME scout_wheel_allocation\n    COMMAND ${PYTHON_EXECUTABLE} ${CMAKE_CURRENT_SOURCE_DIR}/test/test_wheel_allocation.py)\n  add_test(NAME scout_command_timebase\n    COMMAND ${PYTHON_EXECUTABLE} ${CMAKE_CURRENT_SOURCE_DIR}/test/test_command_timebase.py)')
          p.write_text(s)
          Path('scout/test/test_command_timebase.py').write_text('''#!/usr/bin/env python3
          """Time-base wiring and pure delay checks; not a ROS callback integration test."""
          import os
          import subprocess
          import tempfile
          import unittest
          from pathlib import Path
          PACKAGE=Path(__file__).resolve().parents[1]
          class ClockTest(unittest.TestCase):
              def test_runtime_timebase(self):
                  s=(PACKAGE/'src/scout_skid_steer.cpp').read_text()
                  self.assertIn('nh_->createTimer(',s)
                  self.assertNotIn('createWallTimer(',s)
                  self.assertIn('ros::Duration(0.01)',s)
                  self.assertIn('command_delay_.Configure(command_delay_s_)',s)
                  self.assertIn('AllocateWheelTargets(',s)
                  self.assertNotIn('command_time_constant',s)
              def test_delay_on_simulated_sampling_grid(self):
                  code=r"""
          #include "scout_gazebo/command_delay.hpp"
          #include <cmath>
          #include <iostream>
          #include <stdexcept>
          void check(bool x){if(!x)throw std::runtime_error("sampled delay mismatch");}
          int main(){
           for(double h:{.001,.002,.004}){
            double reference_application=-1;
            for(double rtf:{.25,.5,1.,2.}){
             wescore::CommandDelay q;q.Configure(.005);q.Advance(0);
             q.Push(.04,.5,.3);
             double next=.01,applied=-1;
             for(int k=40; k<101; ++k){
              const double t=k*.001;
              if(std::abs(t/h-std::round(t/h))>1e-9)continue;
              const double wall=t/rtf;(void)wall;
              if(t+1e-12<next)continue;
              while(next<=t+1e-12)next+=.01;
              const auto v=q.Advance(t);
              if(v.linear!=0 && applied<0)applied=t;
             }
             check(applied>=.045-1e-12 && applied<.045+.01+h+1e-12);
             if(reference_application<0)reference_application=applied;
             check(std::abs(applied-reference_application)<1e-12);
             q.Push(.12,0,0);check(q.Advance(.124).linear==.5);
             check(q.Advance(.14).linear==0);
             q.Push(.15,-.5,-.3);check(q.Advance(.16).linear==-.5);
             for(int k=0;k<10;++k)check(q.Advance(.16).linear==-.5);
             q.Reset();check(q.Advance(.16).linear==0);
            }
           }
           std::cout<<"3 physics grids x 4 wall-time factors: 5ms delay plus fixed ROS sampling; hold/stop checked\\n";
          }
          """
                  with tempfile.TemporaryDirectory() as directory:
                      cpp=Path(directory)/'test.cpp';exe=Path(directory)/'test'
                      cpp.write_text(code)
                      subprocess.run([os.environ.get('CXX','g++'),'-std=c++17','-Wall','-Wextra','-Werror','-I'+str(PACKAGE/'include'),str(cpp),'-o',str(exe)],check=True)
                      subprocess.run([str(exe)],check=True)
          if __name__=='__main__':unittest.main()
          ''')
      - name: Run standalone regressions
        run: |
          python3 scout/test/test_wheel_allocation.py
          python3 scout/test/test_command_timebase.py
          python3 scout/test/test_stable_defaults.py
      - name: Push the actual source changes and remove this one-shot editing workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue93-apply-model-contract.yml
          git add scout/src/scout_skid_steer.cpp scout/include/scout_gazebo/scout_skid_steer.hpp scout/launch/spawn_accurate.launch scout/CMakeLists.txt scout/test/test_command_timebase.py
          git diff --cached --check
          git commit -m 'fix(scout): sample delay on ROS clock and publish bounded wheel targets'
          git push origin "HEAD:${GITHUB_REF_NAME}"
