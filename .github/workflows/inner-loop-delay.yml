name: Wheel PI transport-delay regression
on:
  push:
    branches: [fix/93-sim-time-command-dispatch]
    paths:
      - 'scout/src/scout_skid_steer.cpp'
      - 'scout/include/scout_gazebo/**'
      - 'scout/test/test_inner_loop_delay.py'
      - '.github/workflows/inner-loop-delay.yml'
  pull_request:
    paths:
      - 'scout/src/scout_skid_steer.cpp'
      - 'scout/include/scout_gazebo/**'
      - 'scout/test/test_inner_loop_delay.py'
      - '.github/workflows/inner-loop-delay.yml'
permissions:
  contents: read
jobs:
  delay-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
          submodules: false
      - name: Test the production delay header without ROS
        run: python3 scout/test/test_inner_loop_delay.py
      - name: Compile the changed production translation unit against ROS Noetic
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work ros:noetic-ros-base-focal \
            bash -lc 'source /opt/ros/noetic/setup.bash; g++ -std=c++17 -Wall -Wextra -Iscout/include -I/opt/ros/noetic/include -c scout/src/scout_skid_steer.cpp -o /tmp/scout_skid_steer.o'
