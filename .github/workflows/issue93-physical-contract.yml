name: Issue 93 physical wheel contract
on:
  push:
    branches: [issue93/physical-wheel-contract]
    paths:
      - .github/workflows/issue93-physical-contract.yml
      - scout/urdf/**
      - scout/launch/**
      - scout/test/test_physical_wheel_contract.py
  pull_request:
    paths:
      - .github/workflows/issue93-physical-contract.yml
      - scout/urdf/**
      - scout/launch/**
      - scout/test/test_physical_wheel_contract.py
permissions:
  contents: read
jobs:
  physical-contract:
    runs-on: ubuntu-24.04
    container: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-full-noetic:1.0.0
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - name: Record installed source interfaces and require xacro
        shell: bash
        run: |
          set -euo pipefail
          source /opt/ros/noetic/setup.bash
          python3 -c 'import xacro; print(xacro.__file__)'
          dpkg-query -W gazebo11 libgazebo11 ros-noetic-gazebo-ros-control ros-noetic-control-toolbox ros-noetic-xacro
          git rev-parse HEAD
      - name: Expand actual source and verify non-default physical parameters
        shell: bash
        run: |
          set -euo pipefail
          source /opt/ros/noetic/setup.bash
          python3 scout/test/test_physical_wheel_contract.py
          git diff --check
