schema: xgc2.product.v1
id: xgc2-gazebo-sim-scout
name: XGC2 Gazebo Classic Scout
version: 0.5.0-2
kind: ros1-apt
summary: AgileX Scout Gazebo Classic simulation package for ROS Noetic.
ros:
  distro: noetic
  packages:
  - gazebo_sim_scout
apt:
  distribution: focal
  install:
  - ros-noetic-xgc2-gazebo-sim-scout
  packages:
  - ros-noetic-xgc2-gazebo-sim-scout
  package_architectures:
    ros-noetic-xgc2-gazebo-sim-scout:
    - amd64
    - arm64
  depends:
  - ros-noetic-xgc2-gazebo-scene (>= 1.5.0-3)
  - ros-noetic-xgc2-simple-lidar (>= 1.4.0-2)
  - ros-noetic-scout-msgs (>= 0.3.3-5)
  - ros-noetic-urdf
  - ros-noetic-xacro
  - ros-noetic-xgc2-scout-description (>= 0.4.10-16)
  - ros-noetic-xgc2-gazebo-sim-worlds (>= 1.4.1-19)
  - ros-noetic-xgc2-gazebo-sim-vrpn-bridge (>= 1.1.0-27)
usage:
  notes: Native world and spawn require caller-provided prepared world grant, explicit simulation-v1 ServiceRef and target. Source candidate only; Focal controlled ABI/deployment and graceful shutdown remain unverified.
  install: 'sudo apt update

    sudo apt install ros-noetic-xgc2-gazebo-sim-scout

    '
  smoke_test: 'test -f /opt/ros/noetic/share/gazebo_sim_scout/plugins/libscout_unicycle_plugin.so

    test -f /opt/ros/noetic/share/gazebo_sim_worlds/launch/native_world.launch

    '
ownership:
  paths:
  - /opt/ros/noetic/share/gazebo_sim_scout
  - /opt/ros/noetic/lib/gazebo_sim_scout
  - /opt/ros/noetic/share/gazebo_sim_scout/plugins/libscout_gazebo.so
  - /opt/ros/noetic/lib/libscout_wheel_velocity_controller.so
  - /opt/ros/noetic/share/gazebo_sim_scout/plugins/libscout_unicycle_plugin.so
  - /opt/ros/noetic/share/gazebo_sim_scout/plugins/libscout_wheel_diagnostics.so
  - /opt/ros/noetic/share/gazebo_sim_scout/plugins/libscout_implicit_wheel_plugin.so
  - /usr/share/xgc2/process-definitions/scout-gazebo-robot.json
release:
  requires:
  - xgc2-gazebo-sim-scenes
  - libxgc2-math-dev
  - xgc2-scout-description
  dependency_policy:
    libxgc2-math-dev: rebuild
    xgc2-gazebo-sim-vrpn-bridge: verify
    xgc2-gazebo-sim-scenes: verify
    xgc2-scout-description: verify
    xgc2-ros-msgs: rebuild
  apt_versions:
    focal: 0.5.0-2
